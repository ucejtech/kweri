name: Release

on:
  push:
    branches: [main]
  # Manual escape hatch: republish the version currently on main when the
  # publish job failed after release-please already tagged the release.
  workflow_dispatch:

jobs:
  # Opens/updates a "release PR" based on Conventional Commits since the last
  # release. Merging that PR bumps the version + changelog and tags a release,
  # which sets release_created=true and triggers the publish job below.
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI — keep in sync with test.yml.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Generate version
        run: node scripts/generate-version.js

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --access public
