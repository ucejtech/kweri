name: Publish to npm

on:
  release:
    types: [published]

# Required for npm trusted publishing (OIDC). No NPM_TOKEN needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      # Fail loudly if the release tag and package.json disagree, instead of
      # silently overriding the version. package.json is the source of truth.
      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag $TAG does not match package.json $PKG. Tag the commit that bumped package.json."
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Generate version
        run: node scripts/generate-version.js

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      # Prereleases (e.g. 0.3.0-rc.1) publish under the `next` tag so they don't
      # move `latest`. Stable versions publish to `latest`.
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
