name: Release

on:
  push:
    branches: [main]

# contents/pull-requests: for the version PR, tags, and GitHub Release.
# id-token: for npm trusted publishing (OIDC) — no NPM_TOKEN needed.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI — keep in sync with test.yml.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install
      - name: Generate version
        run: node scripts/generate-version.js

      - name: Run tests
        run: bun test

      # Opens/updates a "version packages" PR when changesets are pending;
      # publishes to npm (+ tags + GitHub Release) once that PR is merged.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
